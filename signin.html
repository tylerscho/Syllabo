<title>Signing in to Syllabo</title>
<!--
  The app opens this page to start "Continue with Google", so iPhone's sign-in prompt names syllabo.org instead of the
  database's address. It forwards straight on to Syllabo's sign-in service with the same query (provider, the app's
  return address and the one-time PKCE challenge). It only ever forwards to that one fixed address, and the service
  itself checks the return address against its allow list.
-->
<script>location.replace("https://ktceskjocaycnquayffd.supabase.co/auth/v1/authorize" + location.search);</script>
